name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, format, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release build reads its version from git tags.
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Format check
        run: ./gradlew ktfmtCheck --no-daemon

      # Play refuses release notes over 500 characters and short descriptions over 80.
      - name: Store listing limits
        run: |
          status=0
          for f in fastlane/metadata/android/*/changelogs/*.txt; do
            n=$(python3 -c "import sys; print(len(open(sys.argv[1], encoding='utf-8').read().rstrip('\n')))" "$f")
            [ "$n" -le 500 ] || { echo "$f has $n characters, over 500" >&2; status=1; }
          done
          for f in fastlane/metadata/android/*/short_description.txt; do
            n=$(python3 -c "import sys; print(len(open(sys.argv[1], encoding='utf-8').read().rstrip('\n')))" "$f")
            [ "$n" -le 80 ] || { echo "$f has $n characters, over 80" >&2; status=1; }
          done
          exit $status

      - name: Lint
        run: ./gradlew :app:lintRelease :core:lintRelease --no-daemon

      - name: Unit tests
        run: ./gradlew :core:testDebugUnitTest :app:testDebugUnitTest --no-daemon

      - name: Screenshot tests
        run: ./gradlew :app:validateDebugScreenshotTest --no-daemon

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            core/build/reports/
            core/build/test-results/
