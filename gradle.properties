# Gradle daemon memory. The Kotlin compiler, KSP, and R8 share this heap.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# The screenshot test plugin checks this key here and the matching experimentalProperties entry in
# app/build.gradle.kts; it refuses to apply unless both are set.
android.experimental.enableScreenshotTest=true

kotlin.code.style=official
